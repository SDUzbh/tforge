[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indranet"
version = "0.1.0"
description = "IndraNet's Python side: build and train decoder-only transformers with named hook points, and export them for the tfi reverse-engineering engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["indranet*"]
