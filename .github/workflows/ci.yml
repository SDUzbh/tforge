name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # reused by release.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 still does.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
      - name: Install indranet
        run: python -m pip install -e "python[dev]"
      - name: Tests (PyTorch model + C++ golden tests + indra CLI + examples)
        run: python -m pytest -q
      - name: End-to-end example (train, export, analyse in C++)
        run: |
          python examples/induction_heads.py --steps 100 --export induction.safetensors
          build/indra heads induction.safetensors --seg 8 --samples 2
          build/indra circuits induction.safetensors --top 3

  cpp:
    name: C++ ${{ matrix.cxx }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            # GCC's maybe-uninitialized has known false positives around std::optional.
            werror: -Werror -Wno-error=maybe-uninitialized
          - os: ubuntu-latest
            cxx: clang++
            werror: -Werror
          - os: macos-latest
            cxx: clang++
            werror: -Werror
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: make, warnings as errors
        run: make CXXFLAGS="-O2 -pedantic ${{ matrix.werror }}" all test
      - name: CMake
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake --output-on-failure

  sanitizers:
    name: ASan + UBSan (golden tests on sanitized binaries)
    runs-on: ubuntu-latest
    env:
      # make picks these up, so pytest's build of the engine is sanitized too.
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install PyTorch (CPU) and indranet
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "python[dev]"
      - name: C++ unit tests
        run: make test
      - name: Golden tests and CLI
        run: python -m pytest -q python/tests/test_golden.py
      - name: ThreadSanitizer (patching and ablation run on several threads)
        run: |
          make clean
          make CXXFLAGS="-O1 -g -fsanitize=thread" build/tfi_tests
          TFI_THREADS=8 build/tfi_tests
