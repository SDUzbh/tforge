[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tforge"
version = "0.1.0"
description = "Build decoder-only transformers from a config, with hook points for interpretability"
requires-python = ">=3.9"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tforge*"]
